{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Create Category</h2>
    {% if error %}
    <div class="alert alert-warning">
        {{ error }}
    </div>
    {% endif %}
    <form method="post">
        <div class="mb-3">
            <label class="form-label">
                Name
            </label>
            <input type="text" name="name" class="form-control" value="{{ form_data.name if form_data else '' }}"
                required>
        </div>
        <div class="mb-3">
            <label class="form-label">
                Description
            </label>
            <textarea name="description" class="form-control"
                rows="4">{{ form_data.description if form_data else '' }}</textarea>
        </div>
        <button class="btn btn-success">
            Save
        </button>
        <a href="/categories" class="btn btn-secondary">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
